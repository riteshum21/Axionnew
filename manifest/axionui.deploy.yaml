apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  selector:
    matchLabels:
      app: ui
  replicas: 2
  template:
    metadata:
      labels:
        app: ui
 
    spec:
      containers:
      - name: ui
        image: riteshcr.azurecr.io/axionui:v1

        ports:
        - containerPort: 80
