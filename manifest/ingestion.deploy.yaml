apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  selector:
    matchLabels:
      app: ingestion
  replicas: 2
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: riteshcr.azurecr.io/ingestion:v1

        ports:
        - containerPort: 8000

        env:
        - name: DATABASE_URL
          value: "postgresql://admin:admin123@postgres:5432/axiondb"
